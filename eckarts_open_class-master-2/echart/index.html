<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <header>
      <h1>小众目的地识别与方法推荐数据可视化</h1>
      <div class="showTime">当前时间：2020年3月17-0时54分14秒</div>
      <script>
        var t = null;
        t = setTimeout(time, 1000); //開始运行
        function time() {
          clearTimeout(t); //清除定时器
          dt = new Date();
          var y = dt.getFullYear();
          var mt = dt.getMonth() + 1;
          var day = dt.getDate();
          var h = dt.getHours(); //获取时
          var m = dt.getMinutes(); //获取分
          var s = dt.getSeconds(); //获取秒
          document.querySelector(".showTime").innerHTML =
  "当前时间：" + y + "年" + mt + "月" + day + "日 " + h + "时" + m + "分" + s + "秒";
          t = setTimeout(time, 1000); //设定定时器，循环运行
        }
      </script>
    </header>
    <section class="mainbox">
      <div class="column">
        <div class="panel bar">
          <h2>小众目的地省份分布 Top 10
            <a href="javascript:;" style="font-size: 0.8em;">极致秘境</a>
            <a href="javascript:;" style="font-size: 0.8em;">高潜小众</a>
          </h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
        <div class="panel line">
          <h2>折线图-全库景点“小众指数”长尾分布</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
        <div class="panel pie">
          <h2>环形图-小众秘境资源类型</h2>
          <div class="chart"></div>
          <div class="panel-footer"></div>
        </div>
      </div>
      <div class="column">
        <div class="no">
          <div class="no-hd">
            <ul>
              <li>30345</li>
              <li>1994</li>
            </ul>
          </div>
          <div class="no-bd">
            <ul>
              <li>收录游记总数</li>
              <li>小众目的地数量</li>
            </ul>
          </div>
        </div>
        <div class="map">
          <div class="chart"></div>
          <div class="map1"></div>
          <div class="map2"></div>
          <div class="map3"></div>
        </div>
      </div>

        <div class="column">

        <div class="panel wordcloud-panel">
            <div class="tab-nav">
                <a href="javascript:;" class="active" data-type="小众特征">✨ 小众特征</a>
                <a href="javascript:;" data-type="大众特征">🔥 大众特征</a>
            </div>
            <div class="chart wordcloud-chart" style="height: 240px;"></div>
            <div class="panel-footer"></div>
        </div>

        <div class="panel">
              <h2>雷达图-旅游地特征画像</h2>
              <div class="chart" id="radar"></div>
              <div class="panel-footer"></div>
        </div>

        <div class="panel">
                <h2>桑基图-省份与特征关联</h2>
                <div class="chart" id="sankey"></div>
                <div class="panel-footer"></div>
        </div>

      </div>
    </section>
    <script src="js/flexible.js"></script>
    <script src="js/jquery.js"></script>
    <script src="js/echarts.min.js"></script>

    <script src="https://cdn.bootcdn.net/ajax/libs/echarts-wordcloud/1.1.3/echarts-wordcloud.min.js"></script>    <script src="js/index.js"></script>
    <script src="js/china.js"></script>
    <script src="js/myMap.js"></script>
  </body>
</html>
