<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统登录 - 科技风流式布局</title>

  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <script src="https://unpkg.com/element-ui/lib/index.js"></script>

  <style>
    /* === 1. 基础背景与清除默认样式 === */
    body {
      margin: 0;
      padding: 0;
      /* 这里替换为您的背景图片路径 */
      background: url("images/bg.jpg") no-repeat center center;
      background-size: cover;
      background-attachment: fixed;
      height: 100vh;
      overflow: hidden;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
    }

    header {
      width: 100%;
      height: 80px;
      text-align: center;
      position: relative;
    }
    header h1 {
      font-size: 32px;
      color: #fff;
      line-height: 80px;
      margin: 0;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #0066ff;
    }
    .showTime {
      position: absolute;
      right: 30px;
      top: 30px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* === 2. 核心大盒子 === */
    #app {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -45%);
      width: 800px;
      height: 520px;
      background: rgba(0, 20, 50, 0.5);
      border: 1px solid #0055ff;
      box-shadow: 0 0 20px inset rgba(0, 102, 255, 0.3), 0 0 10px rgba(0, 102, 255, 0.5);
      border-radius: 12px;
      display: flex;
      padding: 40px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    /* === 3. 左侧：Instagram 布局 (保持不变) === */
    .login-left {
      flex: 1.2;
      padding-right: 40px;
      border-right: 1px dashed rgba(0, 102, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-icon {
      align-self: flex-start;
      color: #00e5ff;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .brand-logo {
      font-family: 'Brush Script MT', cursive, sans-serif;
      font-size: 38px;
      color: #fff;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    }

    .input-group {
      width: 100%;
      margin-bottom: 15px;
    }

    .el-input__inner {
      background-color: rgba(0, 30, 80, 0.6) !important;
      border: 1px solid rgba(0, 102, 255, 0.5) !important;
      color: #fff !important;
      height: 42px !important;
      line-height: 42px !important;
      border-radius: 6px !important;
    }
    .el-input__inner::placeholder {
      color: rgba(255, 255, 255, 0.4) !important;
      font-size: 13px;
    }
    .el-input__inner:focus {
      border-color: #00e5ff !important;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .btn-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .btn-row .el-button {
      flex: 1;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn-signup {
      background: transparent !important;
      border: 1px solid #00e5ff !important;
      color: #00e5ff !important;
    }
    .btn-signup:hover {
      background: rgba(0, 229, 255, 0.1) !important;
    }
    .btn-login {
      background: linear-gradient(90deg, #0077ff, #00aaff) !important;
      border: none !important;
      color: #fff !important;
    }
    .btn-login:hover {
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.6);
    }

    .options-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 25px;
    }
    .el-checkbox__label {
      color: rgba(255, 255, 255, 0.6) !important;
      font-size: 12px !important;
    }
    .el-checkbox__inner {
      background-color: transparent !important;
      border-color: #0055ff !important;
    }
    .el-checkbox__input.is-checked .el-checkbox__inner {
      background-color: #00e5ff !important;
      border-color: #00e5ff !important;
    }
    .forgot-link {
      color: #00e5ff;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .app-stores {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .store-btn {
      width: 120px;
      height: 36px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
    }
    .store-btn i {
      font-size: 18px;
      margin-right: 5px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
    }
    .footer-links span {
      cursor: pointer;
    }
    .footer-links span:hover {
      color: rgba(255, 255, 255, 0.6);
    }
    .copyright {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 10px;
    }

    /* === 4. 右侧：替换为二维码区域 === */
    .login-right {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-left: 40px;
    }

    .qr-container {
      width: 160px;
      height: 160px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-container img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .qr-text {
      margin-top: 20px;
      color: #00e5ff;
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>小众目的地识别与方法推荐数据可视化</h1>
    <div class="showTime"></div>
  </header>

  <div id="app">
    <div class="login-left">
      <i class="el-icon-camera top-icon"></i>
      <div class="brand-logo">Instagram</div>

      <div class="input-group">
        <el-input placeholder="学号/用户名/邮箱" v-model="form.account">
          <i slot="suffix" class="el-input__icon el-icon-circle-check" style="color: #00e5ff;"></i>
        </el-input>
      </div>

      <div class="input-group">
        <el-input placeholder="密码" v-model="form.password" show-password></el-input>
      </div>

      <div class="btn-row">
        <el-button class="btn-signup" @click="submitForm">登录</el-button>
        <el-button class="btn-login">注册</el-button>
      </div>

      <div class="options-row">
        <el-checkbox v-model="form.remember">记住密码</el-checkbox>
        <a href="#" class="forgot-link">忘记密码?</a>
      </div>

      <div class="app-stores">
        <div class="store-btn">
          <i class="el-icon-apple"></i> 苹果
        </div>
        <div class="store-btn">
          <i class="el-icon-mobile-phone"></i>安卓
        </div>
      </div>

      <div class="footer-links">
        <span>ABOUT</span> <span>SUPPORT</span> <span>BLOG</span> <span>API</span>
        <span>PRESS</span> <span>JOBS</span> <span>PRIVACY</span> <span>TERMS</span>
      </div>
      <div class="copyright">
        © 2026 INSTAGRAM STYLE BY SYSTEM
      </div>
    </div>

    <div class="login-right">
    <div class="qr-container">
      <img src="images\https___beerpromax-cup.github.io_data-screen_.png" alt="大屏二维码">
    </div>
    <div class="qr-text">扫码预览移动端大屏</div>
</div>
  </div>

  <script>
    // 1. 时间动态显示
    function time() {
      var dt = new Date();
      var y = dt.getFullYear(), mt = dt.getMonth() + 1, day = dt.getDate();
      var h = dt.getHours(), m = dt.getMinutes(), s = dt.getSeconds();
      h = h < 10 ? '0' + h : h; m = m < 10 ? '0' + m : m; s = s < 10 ? '0' + s : s;
      document.querySelector(".showTime").innerHTML = "当前时间：" + y + "年" + mt + "月" + day + "日 " + h + "时" + m + "分" + s + "秒";
      setTimeout(time, 1000);
    }
    time();

    // 2. Vue 实例
    new Vue({
  el: '#app',
  data: {
    // 多管理员列表（可自由增删）
    adminList: [
      { account: "2312010054", password: "1433243", name: "超级管理员" },
      { account: "WYQ", password: "1433243", name: "WYQ管理员" },
     // { account: "lisi", password: "abc123", name: "李四管理员" }
    ],
    form: {
      account: '',
      password: '',
      remember: false
    }
  },
  methods: {
    submitForm: function () {
      // 非空判断
      if (!this.form.account || !this.form.password) {
        this.$message.error('请输入完整的账号和密码信息');
        return;
      }

      // 遍历匹配管理员
      const matchedAdmin = this.adminList.find(admin =>
        admin.account === this.form.account &&
        admin.password === this.form.password
      );

      if (matchedAdmin) {
        this.$message.success(`${matchedAdmin.name} 登录成功，正在进入可视化大屏...`);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } else {
        this.$message.error('账号或密码错误，无管理员权限！');
      }
    }
  }
});
  </script>
</body>
</html>
